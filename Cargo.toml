[package]
name = "upcloud-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Unofficial Rust API client / API bindings for the UpCloud API"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rnowak/upcloud-api"
keywords = ["upcloud", "cloud", "api", "sdk", "async"]
categories = ["api-bindings", "web-programming::http-client"]
readme = "README.md"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = { version = "3", features = ["chrono"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
url = "2"
base64 = "0.22"
